  if(bg){try{sessionStorage.setItem(LS.prefs+'.bg',JSON.stringify(bg))}catch(_){}}
  if(!bgSessionOnly){bgSessionOnly=true;toast('A imagem é grande demais para o armazenamento local: o fundo será mantido apenas nesta sessão. Tente uma imagem menor para salvá-la permanentemente.','warn')}
  return false}catch(_){return false}}}
function setPath(path,val){var ks=path.split('.'),o=S;for(var i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=='object'||!o[ks[i]])o[ks[i]]={};o=o[ks[i]]}o[ks[ks.length-1]]=val}
function getPath(path){return path.split('.').reduce(function(o,k){return o?o[k]:undefined},S)}
function isDark(){return S.prefs.theme==='dark'||(S.prefs.theme==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)}

/* ================= aplicação visual ================= */
function applyVisualPrefs(){var de=document.documentElement;
 de.setAttribute('data-theme',isDark()?'dark':'light');
 var a=ACCENTS[S.prefs.accent]||ACCENTS.zen;
 de.style.setProperty('--accent',a.c);de.style.setProperty('--accent-text',a.t);
 de.style.setProperty('--accent-soft',hexA(a.c,.14));de.style.setProperty('--accent-link',isDark()?a.c:a.d);
 de.style.fontSize=(16*S.prefs.fontScale)+'px';
 de.classList.toggle('hc',!!S.prefs.highContrast);
 de.classList.toggle('rm',!!S.prefs.reducedMotion);
 de.classList.toggle('fx',!!S.prefs.focusExtra);
 de.style.setProperty('--sp',S.prefs.density==='compact'?'0.85':S.prefs.density==='spaced'?'1.15':'1');
 applyBackground()}
function applyBackground(){var bg=S.session?S.prefs.bg:null;var el=document.getElementById('appbg');
 document.body.classList.toggle('hasbg',!!(bg&&bg.img));
 if(!bg||!bg.img){el.innerHTML='';return}
 var dark=isDark();
 el.innerHTML='<div style="background-image:url(\''+bg.img+'\');background-position:'+bg.pos+';background-size:'+bg.size+';background-repeat:no-repeat;filter:'+(bg.blur?'blur('+bg.blur+'px)':'none')+';opacity:'+bg.opacity+'"></div>'
 +'<div style="background:rgba(0,0,0,'+bg.dim+')"></div>'
 +'<div style="background:'+(dark?'rgba(6,10,7,':'rgba(248,246,238,')+bg.contrast+')"></div>'}
function setPref(path,val){var cur=getPath(path);
 if(typeof cur==='boolean')val=(val==='true');
 else if(typeof cur==='number')val=parseFloat(val);
 setPath(path,val);
 if(path.indexOf('prefs')===0){savePrefs();applyVisualPrefs()}
 render()}
function togglePref(path){var cur=!!getPath(path);setPath(path,!cur);
 if(path==='prefs.zenny.tutorial'&&!cur){try{localStorage.removeItem(LS.tut)}catch(e){}toast('Tutorial reativado — aparecerá na próxima entrada.')}}

 t.innerHTML=ic(type==='err'||type==='warn'?'alert':'check',17)+'<span>'+esc(msg)+'</span>';

/* ================= gráficos ================= */
function barsSVG(rows){var max=Math.max(1,Math.max.apply(null,rows.map(function(r){return Math.max(r.income,r.expense)})));
 var step=62,W=Math.max(300,rows.length*step),H=170,g='';
 [0.25,0.5,0.75,1].forEach(function(f){g+='<line x1="0" x2="'+W+'" y1="'+(H-H*f)+'" y2="'+(H-H*f)+'" stroke="var(--border)" stroke-dasharray="3 4"/>'});
 rows.forEach(function(r,i){var x=i*step+12,hi=(r.income/max)*(H-8),he=(r.expense/max)*(H-8);
  g+='<rect x="'+x+'" y="'+(H-Math.max(hi,2))+'" width="17" height="'+Math.max(hi,2)+'" rx="4" fill="var(--accent)" opacity=".92"><title>Receitas: '+fmt(r.income)+'</title></rect>';
  g+='<rect x="'+(x+21)+'" y="'+(H-Math.max(he,2))+'" width="17" height="'+Math.max(he,2)+'" rx="4" fill="var(--danger)" opacity=".88"><title>Despesas: '+fmt(r.expense)+'</title></rect>';
  g+='<text class="axis" x="'+(x+19)+'" y="'+(H+18)+'" text-anchor="middle">'+esc(r.label)+'</text>'});
 return '<div style="overflow-x:auto"><svg width="'+W+'" height="'+(H+26)+'" role="img" aria-label="Gráfico de receitas e despesas">'+g+'</svg></div>'
 +'<div class="legend" style="margin-top:.5rem"><span><i class="dot" style="background:var(--accent)"></i>Receitas</span><span><i class="dot" style="background:var(--danger)"></i>Despesas</span></div>'}
function donutBlock(items){var total=items.reduce(function(s,i){return s+i.value},0);
 if(total<=0)return '<p class="muted small">Sem despesas no período selecionado.</p>';
 var size=168,R=size/2-16,C=2*Math.PI*R,acc=0,circles='';
 items.forEach(function(it){var dash=it.value/total*C;
  circles+='<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+R+'" fill="none" stroke="'+it.color+'" stroke-width="21" stroke-dasharray="'+dash+' '+(C-dash)+'" stroke-dashoffset="'+(-acc)+'"><title>'+esc(it.label)+': '+fmt(it.value)+'</title></circle>';acc+=dash});
 var leg=items.map(function(it){return '<li><i class="dot" style="background:'+it.color+'"></i>'+esc(it.label)+' — <strong>'+fmt(it.value)+'</strong> ('+Math.round(it.value/total*100)+'%)</li>'}).join('');
 return '<div class="donut-wrap"><svg width="'+size+'" height="'+size+'" role="img" aria-label="Despesas por categoria"><g transform="rotate(-90 '+(size/2)+' '+(size/2)+')">'+circles+'</g><text x="50%" y="48%" text-anchor="middle" class="donut-total">'+fmt(total)+'</text><text x="50%" y="60%" text-anchor="middle" fill="var(--muted)" font-size="10.5">despesas</text></svg><ul class="legend col" style="list-style:none">'+leg+'</ul></div>'}

/* ================= cálculos do dashboard ================= */
function monthAgg(){var cur=isoLocal(new Date()).slice(0,7),d=S.data;
 var inc=d.transactions.filter(function(t){return t.type==='income'&&t.date.slice(0,7)===cur}).reduce(function(s,t){return s+t.value},0);
 var exp=d.transactions.filter(function(t){return t.type==='expense'&&t.date.slice(0,7)===cur}).reduce(function(s,t){return s+t.value},0);
 return{inc:inc,exp:exp,cur:cur}}
function balance(){return S.data.initialBalance+S.data.transactions.reduce(function(s,t){return s+(t.type==='income'?t.value:-t.value)},0)}
function pendingSum(){return S.data.bills.filter(function(b){return b.status!=='paid'}).reduce(function(s,b){return s+b.value},0)}
function reservedSum(){return S.data.goals.reduce(function(s,g){return s+g.saved},0)}
function catData(){var cur=isoLocal(new Date()).slice(0,7),m={};
 S.data.transactions.filter(function(t){return t.type==='expense'&&t.date.slice(0,7)===cur}).forEach(function(t){m[t.cat]=(m[t.cat]||0)+t.value});
 return Object.keys(m).map(function(k){return{label:k,value:m[k],color:CAT_COLORS[k]||'#9AA69E'}}).sort(function(a,b){return b.value-a.value})}
function chartRows(){var now=new Date(),d=S.data,m=monthAgg();
 if(S.dashPeriod==='ano'){var rows=d.history.map(function(h){return{label:h.label,income:h.income,expense:h.expense}});
  rows.push({label:now.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),income:m.inc,expense:m.exp});return rows}
 if(S.dashPeriod==='semana'){var out=[];
  for(var i=6;i>=0;i--){var dt=new Date();dt.setDate(dt.getDate()-i);var key=isoLocal(dt);
   var t=d.transactions.filter(function(x){return x.date===key});
   out.push({label:dt.toLocaleDateString('pt-BR',{weekday:'short'}).slice(0,3),
    income:t.filter(function(x){return x.type==='income'}).reduce(function(s,x){return s+x.value},0),
    expense:t.filter(function(x){return x.type==='expense'}).reduce(function(s,x){return s+x.value},0)})}
  return out}
 var rows2=[],dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
 for(var w=0;w<Math.ceil(dim/7);w++){var inc=0,exp=0;
  d.transactions.forEach(function(t){if(t.date.slice(0,7)!==m.cur)return;var day=+t.date.slice(8,10);
   if(day>=w*7+1&&day<=w*7+7){t.type==='income'?inc+=t.value:exp+=t.value}});
  rows2.push({label:'Sem '+(w+1),income:inc,expense:exp})}
 return rows2}

/* ================= notificações ================= */
function notifs(){var d=S.data,np=S.prefs.notif,out=[];
 var late=d.bills.filter(function(b){return b.status==='late'});
 var soon=d.bills.filter(function(b){return b.status==='pending'&&daysDiff(b.due)>=0&&daysDiff(b.due)<=7});
 if(np.bills){late.forEach(function(b){out.push({id:'b'+b.id,sev:'danger',title:'Conta atrasada',desc:b.name+' venceu em '+fmtDate(b.due)+' ('+fmt(b.value)+'). Toque para revisar.',view:'transactions'})});
  soon.forEach(function(b){out.push({id:'s'+b.id,sev:'warn',title:'Conta a vencer',desc:b.name+' vence em '+daysDiff(b.due)+' dia(s) — '+fmt(b.value)+'.',view:'transactions'})})}
 if(np.goals){d.goals.forEach(function(g){var pct=Math.round(g.saved/g.target*100);
  if(pct>=100)out.push({id:'g'+g.id,sev:'ok',title:'Meta alcançada! 🎉',desc:'Você concluiu "'+g.name+'". A Zenny está comemorando com você!',view:'goals'});
  else if(pct>=70)out.push({id:'g'+g.id,sev:'ok',title:'Meta quase lá',desc:'"'+g.name+'" está '+pct+'% concluída. Falta pouco!',view:'goals'})})}
 if(np.budget){var m=monthAgg();
  if(m.inc>0&&m.exp/m.inc>0.4)out.push({id:'budget1',sev:'warn',title:'Orçamento em atenção',desc:'As despesas registradas no mês representam '+Math.round(m.exp/m.inc*100)+'% da sua renda demonstrativa.',view:'transactions'});
  else out.push({id:'budget2',sev:'ok',title:'Orçamento em dia',desc:'Suas despesas demonstrativas estão dentro de um patamar confortável da renda.',view:'transactions'})}
 if(np.summary)out.push({id:'sum1',sev:'info',title:'Resumo financeiro disponível',desc:'Confira a evolução de receitas e despesas nos relatórios da Visão geral.',view:'dashboard'});
 if(np.tips)out.push({id:'tip1',sev:'info',title:'Dica da Zenny',desc:'Antes de uma compra maior, use o simulador para ver o impacto no saldo e nas metas.',view:'simulator'});
 return out}

function doLogin(sess){S.session=sess;saveLS(LS.session,sess);
 S.auth={mode:'login',fields:{name:'',email:'',pw:'',pw2:''},errs:{},showPw:false,forgotDone:false};
 S.notifOpen=false;S.zenOpen=false;S.simResult=null;
 S.view=S.prefs.homeScreen||'dashboard';
 S.tutOpen=!!(S.prefs.zenny.tutorial&&!loadLS(LS.tut,false));S.tutStep=0;
 render();toast(sess.demo?'Modo demonstração iniciado — dados fictícios carregados.':'Bem-vindo(a) de volta, '+sess.name.split(' ')[0]+'!')}
function submitLogin(){collectAuth();var a=S.auth;a.errs={};
 if(!EMAIL_RE.test(a.fields.email.trim()))a.errs.email='Informe um e-mail válido (ex.: nome@dominio.com).';
 if(a.fields.pw.length<4)a.errs.pw='A senha precisa ter pelo menos 4 caracteres.';
 if(Object.keys(a.errs).length){render();return}
 var users=loadLS(LS.users,[]);
 var u=users.find(function(x){return x.email.toLowerCase()===a.fields.email.trim().toLowerCase()});
 if(!u){a.errs.email='Não encontramos uma conta local com este e-mail. Crie uma conta ou use a demonstração.';render();return}
 if(hashPw(a.fields.pw)!==u.hash){a.errs.pw='Senha incorreta.';render();return}
 doLogin({name:u.name,email:u.email,demo:false})}
function submitSignup(){collectAuth();var a=S.auth;a.errs={};
 if(a.fields.name.trim().length<2)a.errs.name='Informe seu nome.';
 if(!EMAIL_RE.test(a.fields.email.trim()))a.errs.email='Informe um e-mail válido.';
 if(a.fields.pw.length<4)a.errs.pw='A senha precisa ter pelo menos 4 caracteres.';
 if(a.fields.pw2!==a.fields.pw)a.errs.pw2='As senhas não coincidem.';
 if(Object.keys(a.errs).length){render();return}
 var users=loadLS(LS.users,[]),em=a.fields.email.trim().toLowerCase();
 if(users.some(function(x){return x.email.toLowerCase()===em})){a.errs.email='Já existe uma conta local com este e-mail.';render();return}
 users.push({name:a.fields.name.trim(),email:a.fields.email.trim(),hash:hashPw(a.fields.pw)});
 saveLS(LS.users,users);
 doLogin({name:a.fields.name.trim(),email:a.fields.email.trim(),demo:false});
 toast('Conta demonstrativa criada localmente neste navegador.')}

/* ================= DASHBOARD ================= */
function viewDashboard(){var now=new Date(),m=monthAgg(),d=S.data;
 var bal=balance(),reserved=reservedSum(),pending=pendingSum();
 var free=Math.max(0,bal-reserved-pending);
 var dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
 var daysLeft=Math.max(1,dim-now.getDate()+1);
 var cats=catData(),rows=chartRows();
 var next=d.bills.filter(function(b){return b.status!=='paid'}).sort(function(a,b){return a.due<b.due?-1:1}).slice(0,3);
 var billsHtml=next.length?next.map(function(b){var dd=daysDiff(b.due);
  return '<div class="spread" style="padding:.5rem 0;border-bottom:1px solid var(--border)"><div><strong style="font-size:.9rem">'+esc(b.name)+'</strong>'
  +'<span class="small muted" style="display:block">Vence em '+fmtDate(b.due)+' · <span style="color:'+(dd<0?'var(--danger)':'inherit')+'">'+(dd<0?(-dd)+' dia(s) de atraso':dd===0?'hoje':'em '+dd+' dia(s)')+'</span></span></div>'
  +'<div class="rowflex"><strong class="mono">'+fmt(b.value)+'</strong><button class="btn sm primary" data-act="bill-pay" data-id="'+b.id+'">Pagar</button></div></div>'}).join('')
  :'<p class="muted small">Nenhuma conta em aberto. Boa!</p>';
 var goalsHtml=d.goals.slice(0,2).map(function(g){var pct=g.saved/g.target*100;
  return '<div style="margin-bottom:.8rem"><div class="spread" style="margin-bottom:.25rem"><strong style="font-size:.9rem">'+g.icon+' '+esc(g.name)+'</strong><span class="small muted">'+Math.round(pct)+'%</span></div>'+prog(pct)+'</div>'}).join('');
 var top=cats[0];
 var zenTxt='Suas despesas demonstrativas do mês somam '+fmt(m.exp)+' contra '+fmt(m.inc)+' de receitas'+(top?', com destaque para '+top.label.toLowerCase()+' ('+fmt(top.value)+')':'')+'. Você tem '+fmt(pending)+' em contas em aberto e '+fmt(reserved)+' reservados para metas. Quer simular uma compra antes de decidir?';
 return '<div class="g" style="gap:1.1rem">'
 +'<div class="g g4">'
 +stat('Saldo atual','wallet',fmt(bal),'Inicial do mês: '+fmt(d.initialBalance)+' + receitas − despesas')
 +stat('Receitas do mês','download',fmt(m.inc),'Movimentações do mês corrente','val-pos')
 +stat('Despesas do mês','upload',fmt(m.exp),d.transactions.filter(function(t){return t.type==='expense'}).length+' lançamentos')
 +stat('Reservado para metas','target',fmt(reserved),d.goals.filter(function(g){return!g.paused}).length+' metas ativas · faz parte do saldo')
 +'</div>'
 +'<div class="card"><div class="spread" style="margin-bottom:.9rem"><h3 style="font-size:1.02rem">Receitas × Despesas</h3>'
 +'<div class="seg sm">'+['semana','mes','ano'].map(function(p){return '<button class="seg-btn'+(S.dashPeriod===p?' on':'')+'" data-act="dash-period" data-val="'+p+'">'+(p==='semana'?'Semana':p==='mes'?'Mês':'Ano')+'</button>'}).join('')+'</div></div>'
 +barsSVG(rows)+'</div>'
 +'<div class="g g2"><div class="card"><h3 style="font-size:1.02rem;margin-bottom:.9rem">Despesas por categoria</h3>'+donutBlock(cats)+'</div>'
 +'<div class="g" style="align-content:start">'
 +'<div class="card"><div class="spread" style="margin-bottom:.5rem"><h3 style="font-size:1.02rem">Próximas contas</h3><button class="btn sm ghost" data-act="nav" data-view="transactions">Ver todas</button></div>'+billsHtml+'</div>'
 +'<div class="card"><div class="spread" style="margin-bottom:.5rem"><h3 style="font-size:1.02rem">Metas em andamento</h3><button class="btn sm ghost" data-act="nav" data-view="goals">Ver metas</button></div>'+(goalsHtml||'<p class="muted small">Nenhuma meta ainda.</p>')+'</div>'
 +'<div class="card"><h3 style="font-size:1.02rem;margin-bottom:.4rem">Meu ritmo financeiro</h3><p class="kpi mono" style="color:var(--accent-link)">'+fmt(free/daysLeft)+'/dia</p>'
 +'<p class="small muted">Estimativa de planejamento para gastos variáveis nos próximos '+daysLeft+' dias, considerando contas em aberto ('+fmt(pending)+') e valores reservados. Não é uma garantia de dinheiro livre.</p></div>'
 +'</div></div>'
 +'<div class="card" style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap">'+zennySVG('point',90)
 +'<div style="flex:1;min-width:220px"><span class="badge">'+ic('sparkle',12)+'Resumo da Zenny</span><p style="margin-top:.4rem;font-size:.92rem">'+zenTxt+'</p>'
 +'<p class="hint" style="margin-top:.3rem">Análise gerada a partir dos dados demonstrativos — não é aconselhamento financeiro.</p></div>'
 +'<button class="btn primary" data-act="nav" data-view="simulator">'+ic('zap',15)+'Simular compra</button></div></div>'}

function txRowsHtml(){var q=S.fQ.toLowerCase(),cur=isoLocal(new Date()).slice(0,7);
 var list=S.data.transactions.filter(function(t){
  return (!q||t.desc.toLowerCase().indexOf(q)>-1)&&(!S.fCat||t.cat===S.fCat)&&(!S.fType||t.type===S.fType)
   &&(S.fPer==='tudo'||(S.fPer==='semana'?daysDiff(t.date)>-7&&daysDiff(t.date)<=0:t.date.slice(0,7)===cur))});
 list=list.slice().sort(function(a,b){return S.fSort==='value'?Math.abs(b.value)-Math.abs(a.value):(a.date<b.date?1:-1)});
 if(!list.length)return '<div class="empty">'+ic('search',28)+'<p>Nenhuma movimentação encontrada com os filtros atuais.</p></div>';
 return list.map(function(t){var c=CAT_COLORS[t.cat]||'#9AA69E';
  return '<div class="tx-row"><span class="tx-ico" style="background:'+hexA(c,.16)+';color:'+c+'">'+(t.type==='income'?'↓':'↑')+'</span>'
  +'<div class="tx-main"><strong>'+esc(t.desc)+'</strong><span class="small muted">'+esc(t.cat)+' · '+fmtDate(t.date)+(t.method?' · '+esc(t.method):'')+(t.note?' · '+esc(t.note):'')+'</span></div>'
  +'<strong class="mono '+(t.type==='income'?'val-pos':'val-neg')+'">'+(t.type==='income'?'+':'−')+' '+fmt(t.value)+'</strong>'
  +'<button class="icon-btn" data-act="tx-edit" data-id="'+t.id+'" aria-label="Editar '+esc(t.desc)+'">'+ic('edit',15)+'</button>'
  +'<button class="icon-btn" data-act="tx-del" data-id="'+t.id+'" data-name="'+esc(t.desc)+'" data-value="'+t.value+'" aria-label="Excluir '+esc(t.desc)+'">'+ic('trash',15)+'</button></div>'}).join('')}
function billRowsHtml(){var list=S.data.bills.slice().sort(function(a,b){return a.due<b.due?-1:1});
 if(!list.length)return '<div class="empty">'+ic('calendar',28)+'<p>Nenhuma conta cadastrada.</p></div>';
 return list.map(function(b){var dd=daysDiff(b.due);
  var st=b.status==='paid'?'<span class="badge">Paga</span>':dd<0?'<span class="badge danger">Atrasada</span>':'<span class="badge warn">Pendente</span>';
  return '<div class="tx-row"><span class="tx-ico" style="background:var(--accent-soft);color:var(--accent-link)">'+ic('calendar',16)+'</span>'
  +'<div class="tx-main"><strong>'+esc(b.name)+'</strong><span class="small muted">'+esc(b.cat)+' · vence em '+fmtDate(b.due)+(b.status!=='paid'&&dd<0?' · '+(-dd)+' dia(s) de atraso':'')+'</span></div>'
  +st+'<strong class="mono">'+fmt(b.value)+'</strong>'
  +(b.status!=='paid'?'<button class="btn sm primary" data-act="bill-pay" data-id="'+b.id+'">Marcar paga</button>':'')
  +'<button class="icon-btn" data-act="bill-del" data-id="'+b.id+'" data-name="'+esc(b.name)+'" aria-label="Excluir '+esc(b.name)+'">'+ic('trash',15)+'</button></div>'}).join('')}
function txToolbar(){return '<div class="toolbar">'

 +'<input class="input" style="padding-left:2.1rem" placeholder="Pesquisar por descrição…" value="'+esc(S.fQ)+'" data-input="fQ" aria-label="Pesquisar movimentações"></div>'

 return list.map(function(c){return '<option'+((selected||list[0])===c?' selected':'')+'>'+c+'</option>'}).join('')}
function openTxModal(id){var tx=id?S.data.transactions.find(function(t){return t.id===id}):null;
 var v=tx||{desc:'',type:'expense',cat:'Alimentação',date:isoLocal(new Date()),method:'',note:''};

 +'<div class="field"><label class="label" for="tx-type">Tipo</label><select id="tx-type" class="input" data-change="tx-type"><option value="expense"'+(v.type==='expense'?' selected':'')+'>Despesa</option><option value="income"'+(v.type==='income'?' selected':'')+'>Receita</option></select></div></div>'

 +'<div class="field"><label class="label" for="tx-date">Data</label><input type="date" id="tx-date" class="input" value="'+v.date+'"><span class="err-msg" id="err-tx-date"></span></div></div>'
 +'<div class="field"><label class="label" for="tx-method">Forma de pagamento/recebimento</label><input id="tx-method" class="input" value="'+esc(v.method)+'" placeholder="Pix, cartão, boleto…"></div>'
 +'<div class="field"><label class="label" for="tx-note">Observações (opcional)</label><textarea id="tx-note" class="input" rows="2">'+esc(v.note)+'</textarea></div></div>'
 +'<div class="modal-foot"><button class="btn ghost" data-act="modal-close">Cancelar</button><button class="btn primary" data-act="tx-save">'+(tx?'Salvar alterações':'Adicionar')+'</button></div>')}
function submitTx(){var id=$('#tx-id').value;
 var desc=$('#tx-desc').value.trim(),vs=$('#tx-value').value,type=$('#tx-type').value,cat=$('#tx-cat').value,date=$('#tx-date').value;
 var method=$('#tx-method')?$('#tx-method').value.trim():'',note=$('#tx-note')?$('#tx-note').value.trim():'';
 var ok=true,v=parseVal(vs);eClear(['tx-desc','tx-value','tx-date']);
 if(desc.length<2){eSet2('tx-desc','Informe uma descrição.');ok=false}
 if(!(v>0)){eSet2('tx-value','Informe um valor maior que zero.');ok=false}
 if(!date){eSet2('tx-date','Informe a data.');ok=false}
 if(!ok)return;
 var tx={id:id||uid(),desc:desc,value:Math.round(v*100)/100,type:type,cat:cat,date:date,method:method,note:note};
 if(id){var i=S.data.transactions.findIndex(function(t){return t.id===id});if(i>-1)S.data.transactions[i]=tx;toast('Movimentação atualizada.')}
 else{S.data.transactions.push(tx);toast('Movimentação adicionada — saldo e gráficos atualizados.')}
 saveData();closeModal();render()}

function collectSim(){ensureSimF();function g(id){var el=document.getElementById(id);return el?el.value:null}
 var x;
 if((x=g('sim-name'))!=null)S.simF.name=x;
 if((x=g('sim-value'))!=null)S.simF.value=x;
 if((x=g('sim-method'))!=null)S.simF.method=x;
 if((x=g('sim-n'))!=null)S.simF.n=parseInt(x,10)||10;
 if((x=g('sim-date'))!=null)S.simF.date=x;
 if((x=g('sim-goal'))!=null)S.simF.goalId=x}

 h.textContent=S.simF.method==='parcelado'?S.simF.n+'× de '+(pv>0?fmt(Math.round(pv/S.simF.n*100)/100):'—'):''}
function runSim(){collectSim();
 var v=parseVal(S.simF.value),err=$('#err-sim'),iv=$('#sim-value');
 if(!(v>0)){if(err)err.textContent='Informe um valor de compra maior que zero.';if(iv)iv.classList.add('err');return}
 if(err)err.textContent='';if(iv)iv.classList.remove('err');
 var m=monthAgg(),bal=balance(),pending=pendingSum();
 var base=bal-pending;
 var install=S.simF.method==='parcelado',n=clamp(S.simF.n||10,2,24);
 var parcela=Math.round(v/n*100)/100;
 var B=base-(install?parcela:v);
 var g=S.data.goals.find(function(x){return x.id===S.simF.goalId}),meta=null;
 if(g){var months=monthsUntil(g.deadline),need=(g.target-g.saved)/months,capacity=m.inc-m.exp;
  var capAfter=capacity-(install?parcela:Math.min(v,capacity));
  var nm=null,delay=0;
  if(install){if(capAfter<=0)nm=-1;else{nm=Math.ceil((g.target-g.saved)/capAfter);delay=Math.max(0,nm-months)}}
  meta={months:months,need:need,capacity:capacity,install:install,parcela:parcela,nm:nm,delay:delay,name:g.name}}
 S.simResult={v:v,base:base,B:B,install:install,n:n,parcela:parcela,meta:meta};render()}

 var mm={};S.data.transactions.filter(function(x){return x.type==='expense'}).forEach(function(x){mm[x.cat]=(mm[x.cat]||0)+x.value});
 var top=Object.keys(mm).map(function(k){return[k,mm[k]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,3);
 if(/despesa|gasto/.test(t))return fr?'Neste mês você registrou '+fmt(m.exp)+' de despesas contra '+fmt(m.inc)+' de receitas. Suas contas demonstrativas estão equilibradas — quer ver por categoria? 😊':'Despesas do mês: '+fmt(m.exp)+'. Receitas: '+fmt(m.inc)+'.';

 +'<button class="btn sm" data-act="reset-prefs">'+ic('refresh',14)+'Restaurar padrões</button></div>'
 +'<div class="settings"><div class="set-menu" role="tablist" aria-label="Categorias de configuração">'
 +tabs.map(function(t){return '<button role="tab" aria-selected="'+(S.sub===t[0])+'" class="navitem'+(S.sub===t[0]?' on':'')+'" data-act="tab-sub" data-tab="'+t[0]+'"><span class="ni">'+ic(t[2],17)+'</span>'+t[1]+'</button>'}).join('')
 +'</div><div class="card">'+panels[S.sub]()+'</div></div>'}

/* ================= navegação / ações globais ================= */
function goView(v){S.view=v;S.notifOpen=false;S.zenOpen=false;window.scrollTo(0,0);render()}
function logout(){delLS(LS.session);S.session=null;S.view='login';S.notifOpen=false;S.zenOpen=false;render();applyBackground();toast('Sessão demonstrativa encerrada. Seus dados locais continuam salvos.','warn')}
function resetAllPrefs(){S.prefs=DEFAULT_PREFS();S.bgDraft=null;bgSessionOnly=false;
 try{sessionStorage.removeItem(LS.prefs+'.bg')}catch(e){}
 savePrefs();applyVisualPrefs();render();toast('Configurações restauradas ao padrão.')}
function markAllRead(){notifs().forEach(function(n){if(S.data.readIds.indexOf(n.id)<0)S.data.readIds.push(n.id)});saveData();render()}
function cycleTheme(){var order=['light','dark','auto'];
 setPref('prefs.theme',order[(order.indexOf(S.prefs.theme)+1)%3])}

/* ================= render ================= */
function render(){var app=document.getElementById('app');
 if(!S.session){app.innerHTML=viewAuth();applyBackground()}
 else{app.innerHTML=viewShell();
  if(S.view==='settings'&&S.sub==='background')updateBgPreview()}
 app.dataset.ok='1'}

/* ================= eventos: clique ================= */
document.addEventListener('click',function(e){
 var t=e.target;
 if(t.classList&&t.classList.contains('modal-back')){closeModal();return}
 if(S.notifOpen&&!t.closest('.bellwrap')){S.notifOpen=false;render()}
 if(S.zenOpen&&!t.closest('.fz')){S.zenOpen=false;render()}
 var el=t.closest?t.closest('[data-act]'):null;
 if(!el)return;
 var ds=el.dataset,act=ds.act;
 switch(act){
  case 'modal-close':closeModal();break;
  case 'confirm-ok':{var cb=confirmCb;confirmCb=null;closeModal();if(cb)cb();break}
  case 'auth-mode':collectAuth();S.auth.mode=ds.mode;S.auth.errs={};S.auth.forgotDone=false;render();break;
  case 'auth-eye':collectAuth();S.auth.showPw=!S.auth.showPw;render();break;
  case 'auth-demo':doLogin({name:'Alex',email:'alex@demo.zencash.app',demo:true});break;
  case 'legal':openLegal(ds.doc);break;
  case 'theme-cycle':cycleTheme();break;
  case 'eye':setPref('prefs.hideValues',!S.prefs.hideValues);break;
  case 'nav':goView(ds.view);break;
  case 'bell':S.notifOpen=!S.notifOpen;render();break;
  case 'notif-all':markAllRead();break;
  case 'notif-open':{if(S.data.readIds.indexOf(ds.id)<0){S.data.readIds.push(ds.id);saveData()}goView(ds.view);break}
  case 'logout':logout();break;
  case 'tut-prev':S.tutStep=Math.max(0,S.tutStep-1);render();break;
  case 'tut-next':if(S.tutStep<3){S.tutStep++;render()}else endTut();break;
  case 'tut-skip':endTut();break;
  case 'zen-mini':goView('zenny');break;
  case 'zen-pop':S.zenOpen=!S.zenOpen;render();break;
  case 'zen-close':S.zenOpen=false;render();break;
  case 'zen-go':S.zenOpen=false;goView('zenny');break;
  case 'zen-sim':S.zenOpen=false;goView('simulator');break;
  case 'tab-tx':S.txTab=ds.v;render();break;
  case 'tab-sub':S.sub=ds.tab;render();break;
  case 'dash-period':S.dashPeriod=ds.val;render();break;
  case 'toggle':togglePref(ds.path);render();break;
  case 'seg':setPref(ds.path,ds.val);break;
  case 'accent':setPref('prefs.accent',ds.val);break;
  case 'restore-accent':setPref('prefs.accent','zen');toast('Cores originais restauradas.');break;
  case 'bg-upload':$('#bg-file').click();break;
  case 'bg-remove':ensureBgDraft();S.bgDraft.img=null;render();break;
  case 'bg-apply':applyBg();break;
  case 'bg-cancel':S.bgDraft=S.prefs.bg?Object.assign({},S.prefs.bg):null;render();break;
  case 'bg-restore':setPath('prefs.bg',null);S.bgDraft=null;savePrefs();applyVisualPrefs();render();toast('Fundo original do ZenCash restaurado.');break;
  case 'bg-default':setPath('prefs.bg',null);S.bgDraft=null;savePrefs();applyVisualPrefs();render();toast('Usando fundo padrão do ZenCash.');break;
  case 'pos':ensureBgDraft();S.bgDraft.pos=ds.pos;render();break;
  case 'gicon':{var inp=$('#goal-icon');if(inp)inp.value=ds.i;
   $$('.posbtn.gi').forEach(function(b){b.classList.toggle('on',b.dataset.i===ds.i)});break}
  case 'tx-new':openTxModal(null);break;
  case 'tx-edit':openTxModal(ds.id);break;
  case 'tx-del':askConfirm('Excluir movimentação','Remover "'+ds.name+'" ('+fmt(parseFloat(ds.value))+')? O saldo será recalculado.',function(){S.data.transactions=S.data.transactions.filter(function(x){return x.id!==ds.id});saveData();toast('Movimentação excluída.','warn');render()},true);break;
  case 'tx-save':submitTx();break;
  case 'bill-new':openBillModal();break;
  case 'bill-pay':payBill(ds.id);break;
  case 'bill-del':askConfirm('Excluir conta','Remover a conta "'+ds.name+'"?',function(){S.data.bills=S.data.bills.filter(function(b){return b.id!==ds.id});saveData();toast('Conta excluída.','warn');render()},true);break;
  case 'bill-save':submitBill();break;
  case 'goal-new':openGoalModal(null);break;
  case 'goal-edit':openGoalModal(ds.id);break;
  case 'goal-pause':{var g2=S.data.goals.find(function(x){return x.id===ds.id});
   if(g2){g2.paused=!g2.paused;saveData();toast(g2.paused?'Meta pausada.':'Meta retomada.','warn');render()}break}
  case 'goal-del':askConfirm('Excluir meta','Excluir "'+ds.name+'"? Essa ação não pode ser desfeita no protótipo.',function(){S.data.goals=S.data.goals.filter(function(g){return g.id!==ds.id});saveData();toast('Meta excluída.','warn');render()},true);break;
  case 'goal-dep':openDepModal(ds.id);break;
  case 'goal-save':submitGoal(ds.id);break;
  case 'dep-save':submitDep(ds.id);break;
  case 'sim-run':runSim();break;
  case 'sim-edit':case 'sim-compare':S.simResult=null;render();break;
  case 'sim-save':{var r=S.simResult;if(!r)break;
   S.data.sims.unshift({id:uid(),name:S.simF.name||'Compra',value:r.v,when:isoLocal(new Date()),after:r.B});
   S.data.sims=S.data.sims.slice(0,8);saveData();toast('Simulação guardada no protótipo.');render();break}
  case 'sim-del':S.data.sims=S.data.sims.filter(function(s){return s.id!==ds.id});saveData();render();break;
  case 'chip':sendChat(ds.say);break;
  case 'acct-edit':openAcctModal();break;
  case 'acct-save':submitAcct();break;
  case 'reset-prefs':askConfirm('Restaurar configurações?','Todas as preferências voltarão ao padrão. Dados financeiros não são afetados.',resetAllPrefs);break;
  case 'restore-demo':askConfirm('Restaurar demonstração','Substituir os dados atuais pelos dados de demonstração originais?',function(){S.data=DEMO_DATA();saveData();toast('Dados de demonstração restaurados.');render()});break;
  case 'wipe-all':askConfirm('Apagar todos os dados locais?','Isso remove dados, preferências e contas locais deste navegador. A ação não pode ser desfeita.',function(){Object.keys(LS).forEach(function(k){delLS(LS[k])});try{sessionStorage.removeItem(LS.prefs+'.bg')}catch(e){};location.reload()},true);break;
  case 'export-json':exportJSON();break;
  case 'export-csv':exportCSV();break;
  case 'import-open':$('#imp-file').click();break;
 }});

/* ================= eventos: change / input / submit / teclado ================= */
document.addEventListener('change',function(e){var el=e.target;
 if(el.id==='bg-file'){handleBgFile(el);el.value='';return}
 if(el.id==='imp-file'){handleImportFile(el);el.value='';return}
 var dc=el.dataset?el.dataset.change:null;if(!dc)return;
 if(dc==='fCat'){S.fCat=el.value;updateTxRows()}
 else if(dc==='fType'){S.fType=el.value;updateTxRows()}
 else if(dc==='fPer'){S.fPer=el.value;updateTxRows()}
 else if(dc==='fSort'){S.fSort=el.value;updateTxRows()}
 else if(dc==='homeScreen'){setPref('prefs.homeScreen',el.value)}
 else if(dc==='sim-method'){collectSim();S.simF.method=el.value;render()}
 else if(dc==='tx-type'){var sel=$('#tx-cat');if(sel)sel.innerHTML=catOptions(el.value,null)}});
document.addEventListener('input',function(e){var el=e.target,di=el.dataset?el.dataset.input:null;if(!di)return;
 if(di==='fQ'){S.fQ=el.value;updateTxRows()}
 else if(di==='bgd'){ensureBgDraft();S.bgDraft[el.dataset.k]=parseFloat(el.value);updateBgPreview();
  var out=$('#out-'+el.dataset.k);if(out)out.textContent=fmtOut(el.dataset.k,S.bgDraft[el.dataset.k])}
 else if(di==='sim-name'){ensureSimF();S.simF.name=el.value}
 else if(di==='sim-value'){ensureSimF();S.simF.value=el.value;updateSimHint()}
 else if(di==='sim-n'){ensureSimF();S.simF.n=parseInt(el.value,10)||10;updateSimHint()}});
document.addEventListener('submit',function(e){var f=e.target.closest?e.target.closest('form[data-form]'):null;
 if(!f)return;e.preventDefault();
 var k=f.dataset.form;
 if(k==='login')submitLogin();
 else if(k==='signup')submitSignup();
 else if(k==='forgot')submitForgot();
 else if(k==='chat')sendChat(null)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.querySelector('.modal-back'))closeModal()});
try{var mq=matchMedia('(prefers-color-scheme: dark)');
 var mfn=function(){if(S.prefs.theme==='auto'){applyVisualPrefs();render()}};
 if(mq.addEventListener)mq.addEventListener('change',mfn);else if(mq.addListener)mq.addListener(mfn)}catch(e){}
window.addEventListener('error',function(e){var a=document.getElementById('app');
 if(a&&!a.dataset.ok)a.innerHTML='<div style="padding:2rem;font-family:sans-serif;color:#FF5B63">Ops — ocorreu um erro ao iniciar o protótipo. Recarregue a página (F5).<br><small>'+esc(e.message)+'</small></div>'});

/* ================= inicialização ================= */
applyVisualPrefs();
if(S.session){S.view=S.prefs.homeScreen||'dashboard';
 if(S.prefs.zenny.tutorial&&!loadLS(LS.tut,false))S.tutOpen=true}
render();
</script>
</body>
</html>
